# Server Configuration
server.host=localhost
server.port=12345
server.max_connections=100

# Database Configuration
db.host=localhost
db.port=3306
db.name=fighting_game
db.username=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# Game Configuration
game.window_width=800
game.window_height=600
game.player_speed=5
game.max_health=100
game.attack_damage=10
game.attack_range=50
game.attack_cooldown=500

# Client Configuration
client.auto_reconnect=true
client.connection_timeout=5000
client.ping_interval=30000

# Graphics Configuration
graphics.fps=60
graphics.enable_vsync=true
graphics.show_fps=false
graphics.fullscreen=false

# Audio Configuration
audio.enabled=true
audio.sound_effects=true
audio.background_music=true
audio.master_volume=0.8